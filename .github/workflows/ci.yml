name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet + test
        working-directory: edge
        run: |
          go vet ./...
          go test -count=1 ./...

  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet + test
        working-directory: control
        run: |
          go vet ./...
          go test -count=1 ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: test SDK against a local edge node, then build the release AAR
        run: |
          set -e
          cd edge
          go build -o /tmp/edge .
          go run ./cmd/gencert -host 127.0.0.1 -out /tmp/certs | tee /tmp/gencert.out
          export GAMEC_TEST_PIN=$(grep '^pin:' /tmp/gencert.out | awk '{print $2}')
          export GAMEC_TEST_SECRET=test-secret-not-a-real-one
          /tmp/edge -listen 127.0.0.1:30800 -origin 127.0.0.1:9000 \
            -cert /tmp/certs/cert.pem -key /tmp/certs/key.pem -secret "$GAMEC_TEST_SECRET" > /tmp/edge.log 2>&1 &
          # control service in front of that node
          cd ../control
          go build -o /tmp/control .
          echo "$GAMEC_TEST_SECRET" > /tmp/secret.txt
          export GAMEC_TEST_CONTROL_PUBKEY=$(/tmp/control -gen-key /tmp/sign.key | grep '^public key' | awk '{print $NF}')
          echo "[{\"host\":\"127.0.0.1\",\"port\":30800,\"pin\":\"$GAMEC_TEST_PIN\"}]" > /tmp/nodes.json
          /tmp/control -listen 127.0.0.1:8099 -nodes /tmp/nodes.json -secret-file /tmp/secret.txt \
            -sign-key /tmp/sign.key > /tmp/control.log 2>&1 &
          export GAMEC_TEST_CONTROL_URL=http://127.0.0.1:8099/v1/session
          sleep 2
          cd ../android-sdk
          gradle --no-daemon testDebugUnitTest assembleRelease assembleDebugAndroidTest || { echo "--- edge log:"; cat /tmp/edge.log; echo "--- control log:"; cat /tmp/control.log; exit 1; }

      - name: keep the on-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: android-sdk/build/outputs/apk/androidTest/debug/*.apk

  # iOS is built on Codemagic (see codemagic.yaml): GitHub's macOS runners queue for too long.
