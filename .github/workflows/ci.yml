name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet + test
        working-directory: edge
        run: |
          go vet ./...
          go test -count=1 ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: build SDK (release AAR)
        working-directory: android-sdk
        run: gradle --no-daemon assembleRelease

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: build SDK
        working-directory: ios-sdk
        run: swift build
