{{template "head" .}}
<form method="post" action="/login" class="card narrow">
  <label>User name <input name="user" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <label>Code from your authenticator app <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label>
  <button>Sign in</button>
</form>
{{template "foot" .}}
