{{template "head" .}}
<form method="post" action="/login" class="card card-md" autocomplete="on">
  <div class="card-body">
    <h2 class="h2 text-center mb-4">登录</h2>
    <div class="mb-3"><label class="form-label" for="l-user">账号</label><input class="form-control" id="l-user" name="user" autocomplete="username" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="l-pw">密码</label><input class="form-control" id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
    <div class="mb-3"><label class="form-label" for="l-code">手机验证码</label>
      <input class="form-control" id="l-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" required>
      <div class="form-hint">打开手机上的验证器 App（Google Authenticator、Microsoft Authenticator 之类），输入这个账号现在显示的 6 位数字。</div></div>
    <button class="btn btn-primary w-100">登录</button>
  </div>
</form>
{{template "foot" .}}
