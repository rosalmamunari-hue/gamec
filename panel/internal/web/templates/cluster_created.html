{{template "head" .}}
<div class="banner warn"><b>請立刻複製 token 密鑰。</b>它只會在這一頁顯示。之後只能在伺服器上用 <code>panel get-secret</code> 讀取。</div>
<section class="card">
  <dl>
    <dt>集群</dt><dd>{{.Data.Cluster.Name}}</dd>
    <dt>Token 密鑰（交給此集群的每個節點，作為 <code>-secret</code> 參數）</dt><dd><code class="wrap">{{.Data.NodeSecret}}</code></dd>
    <dt>公鑰（給 App 使用）</dt><dd><code class="wrap">{{.Data.PublicKey}}</code></dd>
  </dl>
  <p>下一步：新增節點、設定 DNS 憑證，然後手動發布一次。</p>
  <p><a class="btn" href="/cluster/{{.Data.Cluster.ID}}">開啟集群</a></p>
</section>
{{template "foot" .}}
