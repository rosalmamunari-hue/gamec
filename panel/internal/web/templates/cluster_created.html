{{template "head" .}}
<div class="banner warn"><b>现在就把下面的「连接密钥」拷贝存好。</b>它只会在这一页出现一次，之后只能在面板所在的服务器上用 <code>panel get-secret</code> 读。</div>
<section class="card">
  <dl>
    <dt>渠道</dt><dd>{{.Data.Cluster.Name}}</dd>
    <dt>连接密钥（给这个渠道的每个节点，启动时用 <code>-secret</code> 参数带上）</dt><dd><code class="wrap">{{.Data.NodeSecret}}</code></dd>
    <dt>公钥（填进 App；公开的，不是秘密）</dt><dd><code class="wrap">{{.Data.PublicKey}}</code></dd>
  </dl>
  <p>接下来：加节点、贴 Cloudflare 令牌、更新一次名单。渠道页上有一步一步的清单带你做。</p>
  <p><a class="btn primary" href="/cluster/{{.Data.Cluster.ID}}">打开这个渠道</a></p>
</section>
{{template "foot" .}}
