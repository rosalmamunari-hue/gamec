{{template "head" .}}
<section class="card">
  <p class="muted">面板用來修改 DNS 記錄的憑證。它們以加密方式保存，可以在這裡取代，但無法讀回。請給每個服務商帳號只能編輯這一個網域的 token。</p>
  {{if .Sealed}}
    <p class="alert">請先解封保險庫才能管理憑證。</p>
  {{else}}
    <h2>已儲存</h2>
    {{if .Data}}<ul>{{range .Data}}<li><code>{{.}}</code></li>{{end}}</ul>{{else}}<p class="muted">目前沒有。</p>{{end}}
    <h2>設定或取代</h2>
    <form method="post" action="/secrets" class="stack">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>名稱 <input name="ref" placeholder="main" required></label>
      <label>欄位
        <select name="field">
          <option value="api_token">api_token (Cloudflare)</option>
          <option value="api_key">api_key (Spaceship)</option>
          <option value="api_secret">api_secret (Spaceship)</option>
          <option value="access_key_id">access_key_id (阿里雲)</option>
          <option value="access_key_secret">access_key_secret (阿里雲)</option>
        </select></label>
      <label>值 <input name="value" type="password" autocomplete="off" required></label>
      <button>儲存</button>
    </form>
  {{end}}
</section>
{{template "foot" .}}
