{{template "head" .}}
<p class="lead">这里记着谁在什么时候做了什么。每一笔都带着前一笔的指纹，有人偷偷删改就会断掉。</p>
<p>完整性检查：<b class="{{if eq .Data.Chain "intact"}}okc{{else}}badc{{end}}">{{if eq .Data.Chain "intact"}}没有被改动{{else}}{{.Data.Chain}}{{end}}</b></p>
<div class="card tablewrap">
<table>
  <tr><th>时间 (UTC)</th><th>谁</th><th>来自</th><th>做了什么</th><th>细节</th><th>成功吗</th></tr>
  {{range .Data.Entries}}
  <tr class="{{if .OK}}{{else}}failed{{end}}">
    <td>{{ts .Time}}</td><td>{{.User}}</td><td>{{.IP}}</td><td>{{.Action}}</td><td class="wrap">{{.Detail}}</td><td>{{if .OK}}是{{else}}否{{end}}</td>
  </tr>
  {{end}}
</table>
</div>
{{template "foot" .}}
