{{template "head" .}}
<form method="post" action="/cluster/new" class="card stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <p class="muted">A cluster is one release channel: its own origin server, nodes, DNS name, signing key and token secret. A new signing key and token secret are generated here and stored in the vault.</p>
  <label>Name (for example the channel) <input name="name" required></label>
  <label>Origin (where its nodes forward to; for your notes) <input name="origin" placeholder="203.0.113.5:10443"></label>
  <label>Each signed list is valid for (days) <input name="valid_days" value="30" size="4" required></label>
  <label>Renew this many days before it expires <input name="renew_days" value="10" size="4" required></label>
  <h2>First DNS target</h2>
  <label>Provider
    <select name="provider"><option>manual</option><option>cloudflare</option><option>spaceship</option><option>aliyun</option></select></label>
  <label>Zone (the registered domain) <input name="zone" placeholder="example.com" required></label>
  <label>Record name <input name="dns_name" placeholder="_gs.example.com" required></label>
  <label>Credentials name (not needed for manual) <input name="cred_ref" placeholder="main"></label>
  <button class="primary">Create cluster</button>
</form>
{{template "foot" .}}
