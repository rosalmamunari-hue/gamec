{{template "head" .}}
<div class="row justify-content-center">
<div class="col-lg-8">
<form method="post" action="/cluster/new" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="card-header"><h3 class="card-title">渠道</h3></div>
  <div class="card-body">
    <div class="mb-3"><label class="form-label required" for="n-name">渠道名称</label><input class="form-control" id="n-name" name="name" placeholder="例如：官服、华为渠道" required>
      <div class="form-hint">方便你认就行。</div></div>
    <div class="mb-3"><label class="form-label" for="n-origin">源站地址</label><input class="form-control mono" id="n-origin" name="origin" placeholder="203.0.113.5:10443">
      <div class="form-hint">游戏服务器的 IP:端口，节点最后把玩家的流量转到这里。加节点时要用，现在不填也可以以后在渠道设置里填。</div></div>
    <div class="row">
      <div class="col-6 mb-3"><label class="form-label" for="n-valid">名单有效几天</label><input class="form-control" id="n-valid" name="valid_days" type="number" min="2" max="90" value="30" required></div>
      <div class="col-6 mb-3"><label class="form-label" for="n-renew">到期前几天续期</label><input class="form-control" id="n-renew" name="renew_days" type="number" min="1" max="89" value="10" required></div>
    </div>
    <div class="form-hint mb-0">一般不用改。面板关机太久（超过有效期）时，玩家会找不到节点。</div>
  </div>
  <div class="card-header border-top"><h3 class="card-title">名单写进哪个域名</h3></div>
  <div class="card-body">
    <p class="text-secondary">App 去这个域名读名单。之后可以在渠道页再加备用域名。用 Cloudflare 的话，要先在「<a href="/secrets">域名授权</a>」里贴好令牌。</p>
    {{template "target-fields" dict "T" nil "ID" "new"}}
  </div>
  <div class="card-footer text-end"><a href="/" class="btn">取消</a> <button class="btn btn-primary">{{icon "plus"}}创建渠道</button></div>
</form>
</div>
</div>
{{template "foot" .}}
