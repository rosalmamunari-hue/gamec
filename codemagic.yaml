workflows:
  ios-sdk:
    name: iOS SDK build
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Swift version
        script: swift --version
      - name: Build SDK
        script: |
          cd ios-sdk
          swift build
      - name: End-to-end test against a local edge node
        script: |
          set -e
          brew install go
          cd "$CM_BUILD_DIR/edge"
          go build -o /tmp/edge .
          go run ./cmd/gencert -host 127.0.0.1 -out /tmp/certs | tee /tmp/gencert.out
          export GAMEC_TEST_PIN=$(grep '^pin:' /tmp/gencert.out | awk '{print $2}')
          export GAMEC_TEST_SECRET=test-secret-not-a-real-one

          # fake origin: echoes whatever it receives
          cat > /tmp/echo.py <<'PY'
          import socketserver
          class H(socketserver.BaseRequestHandler):
              def handle(self):
                  while True:
                      d = self.request.recv(4096)
                      if not d:
                          break
                      self.request.sendall(d)
          class S(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
          S(("127.0.0.1", 9000), H).serve_forever()
          PY
          python3 /tmp/echo.py &
          /tmp/edge -listen 127.0.0.1:30800 -origin 127.0.0.1:9000 \
            -cert /tmp/certs/cert.pem -key /tmp/certs/key.pem -secret "$GAMEC_TEST_SECRET" > /tmp/edge.log 2>&1 &

          # control service in front of that node
          cd "$CM_BUILD_DIR/control"
          go build -o /tmp/control .
          echo "$GAMEC_TEST_SECRET" > /tmp/secret.txt
          export GAMEC_TEST_CONTROL_PUBKEY=$(/tmp/control -gen-key /tmp/sign.key | grep '^public key' | awk '{print $NF}')
          echo "[{\"host\":\"127.0.0.1\",\"port\":30800,\"pin\":\"$GAMEC_TEST_PIN\"}]" > /tmp/nodes.json
          /tmp/control -listen 127.0.0.1:8099 -nodes /tmp/nodes.json -secret-file /tmp/secret.txt \
            -sign-key /tmp/sign.key > /tmp/control.log 2>&1 &
          export GAMEC_TEST_CONTROL_URL=http://127.0.0.1:8099/v1/session

          # signed node list served as a fake DoH (the format the real DNS records use)
          cd "$CM_BUILD_DIR/edge"
          go build -o /tmp/signlist ./cmd/signlist
          export GAMEC_TEST_LIST_KEY=$(/tmp/signlist -gen-key /tmp/list.key | grep '^public key' | awk '{print $NF}')
          /tmp/signlist -key /tmp/list.key -nodes /tmp/nodes.json -serve 127.0.0.1:8053 > /tmp/signlist.log 2>&1 &
          export GAMEC_TEST_DOH_URL=http://127.0.0.1:8053/dns-query
          sleep 2

          cd "$CM_BUILD_DIR/ios-sdk"
          swift test || { echo "--- edge log:"; cat /tmp/edge.log; echo "--- control log:"; cat /tmp/control.log; exit 1; }
